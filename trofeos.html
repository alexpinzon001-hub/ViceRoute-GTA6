<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trofeos — ViceRoute GTA VI</title>
<style>
  :root{
    --bg:#0d0f1a; --panel:#151827; --panel2:#1c2034; --line:#2a2f4a;
    --text:#e9ecf8; --muted:#9aa1c0; --pink:#ff4fa3; --teal:#2de0c8; --gold:#ffc24a;
    --sea1:#0f3b5c; --sea2:#0a2740;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .app{display:flex;height:100vh;width:100%;overflow:hidden}
  /* ---------- Sidebar ---------- */
  .side{width:340px;min-width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
  .brand h1{margin:0;font-size:20px;letter-spacing:.5px}
  .brand h1 span{background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
  .section{padding:12px 18px;border-bottom:1px solid var(--line)}
  .section h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  input[type=search],input[type=text],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:60px}
  .cats{display:flex;flex-direction:column;gap:6px}
  .cat{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none;padding:4px 6px;border-radius:6px}
  .cat:hover{background:var(--panel2)}
  .cat input{accent-color:var(--pink)}
  .dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.7)}
  .cat .count{margin-left:auto;color:var(--muted);font-size:12px}
  .bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--pink));width:0}
  .list{flex:1;overflow:auto;padding:6px 10px 16px}
  .group-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:12px 8px 4px}
  .item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:14px}
  .item:hover,.item.active{background:var(--panel2)}
  .item.done .name{text-decoration:line-through;color:var(--muted)}
  .item .reg{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}
  .btn:hover{border-color:var(--pink)}
  .btn.primary{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
  .btn.on{background:var(--teal);border-color:var(--teal);color:#062a26;font-weight:700}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  /* ---------- Map ---------- */
  .mapwrap{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 60% 40%,var(--sea1),var(--sea2));touch-action:none}
  svg#map{width:100%;height:100%;display:block;cursor:grab}
  svg#map.dragging{cursor:grabbing}
  svg#map.editing{cursor:crosshair}
  .region{stroke:rgba(255,255,255,.25);stroke-width:1.5;transition:opacity .2s}
  .region:hover{opacity:.85}
  .rlabel{font-weight:800;letter-spacing:2px;text-transform:uppercase;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:4px;pointer-events:none;text-anchor:middle}
  .slabel{font-size:12px;fill:#f4f4ff;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:3px;pointer-events:none;text-anchor:middle;font-style:italic}
  .marker{cursor:pointer}
  .marker circle.pin{stroke:#fff;stroke-width:2.5}
  .marker.done circle.pin{opacity:.45}
  .marker.sel circle.halo{opacity:1}
  .marker circle.halo{fill:none;stroke:#fff;stroke-width:2;opacity:0}
  .marker text{font-size:11px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .controls{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
  .controls .btn{width:40px;height:40px;font-size:20px;padding:0;background:rgba(21,24,39,.9)}
  .coords{position:absolute;left:14px;bottom:14px;background:rgba(21,24,39,.85);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .legend-hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--teal);color:#062a26;font-weight:700;padding:8px 14px;border-radius:20px;font-size:13px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.4)}
  /* ---------- Info card ---------- */
  .card{position:absolute;right:70px;top:14px;width:320px;max-width:calc(100% - 90px);background:rgba(21,24,39,.97);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .card h2{margin:0 0 4px;font-size:18px}
  .card .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
  .card p{font-size:14px;line-height:1.45;margin:0 0 10px;color:#d6daf0}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin-right:4px}
  .tag.ex{border-color:var(--gold);color:var(--gold)}
  .close{position:absolute;right:10px;top:8px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
  /* ---------- Modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:420px;max-width:100%;max-height:90vh;overflow:auto}
  .modal h2{margin:0 0 12px;font-size:18px}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .toggle-side{display:none}
  /* ---------- Mobile ---------- */
  @media (max-width:820px){
    .app{flex-direction:column-reverse}
    .side{width:100%;min-width:0;height:44vh;border-right:none;border-top:1px solid var(--line);transition:height .25s}
    .side.collapsed{height:52px}
    .side.collapsed > :not(.brand){display:none}
    .brand{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
    .brand p{display:none}
    .toggle-side{display:block;color:var(--muted);font-size:13px}
    .card{right:10px;left:10px;width:auto;max-width:none;top:auto;bottom:10px}
    .controls{top:10px;right:10px}
  }

html,body{height:auto;min-height:100%;} .community,.progress,.legacy{max-width:1200px;margin:auto;padding:14px;} .community h1{margin:0;font-size:28px;letter-spacing:2px}.community h1 span{color:var(--pink)}.community header p,.note,.progress p{color:var(--muted)}.community .row{margin:12px 0}.community a{text-decoration:none}.community iframe{display:block;border:2px solid #ff2a85;border-radius:16px;height:72vh;height:72dvh;min-height:360px;background:#151827;touch-action:auto}.progress label{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line);font-size:16px}.progress input{accent-color:var(--pink);width:22px;height:22px}.legacy summary{cursor:pointer;padding:12px;color:var(--muted)}.legacy .app{height:80vh}.community .btn{min-height:44px;display:inline-flex;align-items:center;font-size:14px}
</style>
</head>
<body><main style="max-width:1200px;margin:auto;padding:14px"><a class="btn" style="display:inline-block;text-decoration:none" href="index.html">← Volver al mapa</a><h1 style="color:#ff4fa3">Colección de trofeos</h1><section id="trophies" class="progress"><style>
#trHero{width:100%;display:flex;align-items:center;gap:18px;text-align:left;background:linear-gradient(120deg,#382344,#151827 65%,#203c43);border:1px solid #ff4fa3;border-radius:20px;padding:20px;color:white;cursor:pointer;perspective:600px}#trHero strong{font-size:26px;color:#ffc24a;display:block}#trHero small{display:block;margin:7px 0}#trHero svg{width:80px;flex:none;animation:trSpin 4s linear infinite;filter:drop-shadow(0 0 12px #ffc24a88)}@keyframes trSpin{to{transform:rotateY(360deg)}}@media(prefers-reduced-motion:reduce){#trHero svg{animation:none}}#trStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}#trStats div{text-align:center;background:#1c2034;border-radius:12px;padding:12px 4px;font-size:12px}#trStats b{display:block;font-size:22px}#trList details{border:1px solid #2a2f4a;border-left:4px solid var(--tc);padding:14px;border-radius:12px;margin:10px 0;background:#151827}#trList summary{font-weight:700;cursor:pointer}#trList p{white-space:pre-wrap;line-height:1.5;color:#d6daf0}#trFilters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}@media(max-width:600px){#trFilters{grid-template-columns:1fr 1fr}#trSearch{grid-column:1/-1}#trHero svg{width:64px}}</style>
<button id="trHero" aria-expanded="false" aria-controls="trPanel"><svg viewBox="0 0 100 110" aria-hidden="true"><defs><linearGradient id="trGold"><stop stop-color="#a86a12"/><stop offset=".45" stop-color="#fff4a8"/><stop offset="1" stop-color="#d69824"/></linearGradient></defs><g fill="url(#trGold)" stroke="#ffdf78" stroke-width="2"><path d="M25 17H8V30Q8 49 32 51V43Q17 41 17 26H25M75 17H92V30Q92 49 68 51V43Q83 41 83 26H75"/><path d="M24 10H76V34Q76 59 55 65V83H68L75 99H25L32 83H45V65Q24 59 24 34Z"/></g><path d="m50 21 5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2Z" fill="#a86a12"/></svg><div style="flex:1"><strong>TROFEOS</strong><small id="trCount"></small><div class="bar"><i id="trBar"></i></div><small>Ver colección y ruta al platino ▾</small></div></button>
<div id="trPanel"><div id="trStats"></div><p>⚠ Spoilers al abrir fichas. Recopilación del 25/11/2026. Las discrepancias se conservan en las fichas. Registro manual guardado en este navegador.</p><div id="trFilters"><input type="search" id="trSearch" placeholder="Buscar trofeo o misión"><select id="trGrade" aria-label="Grado"><option value="">Todos los grados</option><option>Platino</option><option>Oro</option><option>Plata</option><option>Bronce</option></select><select id="trState" aria-label="Estado"><option value="">Todos los estados</option><option value="done">Obtenidos</option><option value="pending">Pendientes</option></select></div><p id="trResults"></p><div id="trList"></div><p><a style="color:#2de0c8" href="https://www.powerpyx.com/gta-6-grand-theft-auto-vi-trophy-guide-roadmap/">PowerPyx</a> · <a style="color:#2de0c8" href="https://sweatschool.app/gta-6/trophies/trophies-and-achievements/">Sweatschool</a> · <a style="color:#2de0c8" href="https://www.3djuegos.com/juegos/grand-theft-auto-vi/guias-y-trucos/todos-logros-trofeos-gta-6-como-conseguirlos">3DJuegos</a></p></div></section>
<script>(()=>{const data=[{"id":1,"name":"Vice Got a Price!","grade":"Platino","detail":"Platino\n\nXbox: No consta\n\n«Congratulations! You’re a Leonida Legend.»\n\nConsigue todos los demás trofeos del modo historia (un jugador). En Xbox no existe el platino; el resto de la lista es la misma. PowerPyx: no hace falta multijugador ni DLC.\n\nConsejos: Sweatschool y PowerPyx estiman unas 200 horas para el platino; la mayor parte corresponde al 100 % (trofeo A Long Road).\n\nPerdible: No\n\nOculto: No\n\nDiscrepancias: 3DJuegos menciona que hay +1 trofeo de platino en PlayStation, pero no lo nombra ni lo incluye en sus tablas."},{"id":2,"name":"A Long Road","grade":"Oro","detail":"Oro\n\nXbox: No consta\n\n«Attain 100% Completion.»\n\nCompleta la lista de 100 % Completion del juego. La lista se desbloquea al terminar la historia en Progreso > Estadísticas > 100 % Completion, pero lo hecho antes sí cuenta. PowerPyx y Sweatschool coinciden en que no es un 100 % real de todo el contenido: se acerca a un 60 % de lo que hay en el juego. La mayoría de coleccionables y secundarias no son obligatorios, o solo en parte. Sweatschool detalla 35 requisitos (12 de historia/tareas, 20 de exploración y actividades, 3 de descubrimiento). PowerPyx indica, entre otros: 100 misiones opcionales (hay de sobra), escanear 200 de 277 vehículos base, estudiar 100 de 255 animales, 70 de 80 desafíos para el 100 % (el trofeo One Last Thing pide 50). Tras los créditos se sigue en mundo abierto.\n\nConsejos: Sweatschool: escanea vehículos y estudia animales desde el primer rato; haz las opcionales cuando salgan; la lista de deseos de Randy en el capítulo 3 cubre gran parte del tráfico de vehículos; usa los filtros de mapa de Robos y Actividades. PowerPyx: es el trofeo más difícil de la lista.\n\nPerdible: No (nada del checklist del 100 % es perdible, según PowerPyx y Sweatschool)\n\nOculto: No\n\nDiscrepancias: 3DJuegos no incluye este trofeo de oro en sus tablas, pese a que Sweatschool y PowerPyx lo listan como uno de los dos oros (además de You Gotta Know When to Get Off). Por eso no hay puntuación Xbox (G) publicada en las fuentes usadas."},{"id":3,"name":"One Last Thing","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Complete 50 Challenges.»\n\nCompleta 50 de los 80 desafíos. La descripción oficial de PowerPyx dice «Complete 50 Challenges». Sweatschool precisa 50 de 80. Para el 100 % PowerPyx pide 70 de 80, así que este trofeo sale por el camino. Se siguen en Progreso > Desafíos.\n\nConsejos: Sweatschool y PowerPyx: muchos se completan solos al jugar. Déjalo para el final y elige los más fáciles que te falten.\n\nPerdible: No\n\nOculto: No"},{"id":4,"name":"The Goodtime State","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Explore all of Leonida.»\n\nExplora todo Leonida: destapa la niebla de todo el mapa.\n\nConsejos: Sweatschool y PowerPyx: lo más rápido es hacerlo en avión.\n\nPerdible: No\n\nOculto: No"},{"id":5,"name":"Master of None","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Try each type of activity once.»\n\nPrueba al menos una vez cada tipo de actividad. Sweatschool y 3DJuegos coinciden en que hay nueve tipos. Sweatschool los reporta así: pesca, caza, golf, galería de tiro, billar, aro de baloncesto, un juego de arcade, una carrera o carrera de drones, y un stunt.\n\nPerdible: No\n\nOculto: No"},{"id":6,"name":"Cunning Stunts","grade":"Plata","detail":"Plata\n\nXbox: 40G\n\n«Complete 250 Stunts.»\n\nCompleta 250 acrobacias (stunts). Hay 397 en total, entre saltos acrobáticos, pasar bajo puentes, knife flights y saltos BASE. El 100 % pide 300, según Sweatschool.\n\nConsejos: Sweatschool: volar por debajo de los puentes es el tipo más rápido.\n\nPerdible: No\n\nOculto: No"},{"id":7,"name":"The Shootist","grade":"Plata","detail":"Plata\n\nXbox: 40G\n\n«Earn a gold medal in all Shooting Range challenges.»\n\nConsigue oro en todos los desafíos de la galería de tiro. Son 42 medallas de oro en total (Sweatschool, 3DJuegos y PowerPyx).\n\nPerdible: No\n\nOculto: No"},{"id":8,"name":"Top Fun","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Win a Top Fun Drone Race at every location.»\n\nGana una carrera de drones Top Fun en cada localización. Hay 14 localizaciones.\n\nPerdible: No\n\nOculto: No"},{"id":9,"name":"Earn Cash, Not Kudos","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Win 20 different races.»\n\nGana 20 carreras distintas. Sweatschool indica que hay 40 carreras únicas, así que puedes saltarte las que se te atraganten.\n\nPerdible: No\n\nOculto: No"},{"id":10,"name":"Baited My Tackle","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Beat Cal in a fishing challenge.»\n\nGana un desafío de pesca de Cal. Los desafíos se abren después de la misión del capítulo 1 Feng Shui (Sweatschool y PowerPyx). PowerPyx: Cal envía un mensaje que marca un punto de pesca (icono morado) al oeste de Key Lento.\n\nPerdible: Discrepan las fuentes (ver notas)\n\nOculto: No\n\nDiscrepancias: 3DJuegos lo describe como «Gana el desafío de pesca de Cal con un pez loro de más de 2 kg» y lo marca como perdible (Sí). Sweatschool y PowerPyx solo piden ganar un desafío de pesca de Cal y, en el recuento general, PowerPyx cifra en 0 los trofeos perdibles. No aparece en esas dos fuentes el requisito del pez loro."},{"id":11,"name":"Stick Fiddler","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Complete an arcade game.»\n\nCompleta un juego de arcade/recreativa hasta el final. Sweatschool: vale cualquiera de los cuatro videojuegos; tres están en la tele de casa y uno en las recreativas.\n\nPerdible: No\n\nOculto: No"},{"id":12,"name":"Personal Best","grade":"Bronce","detail":"Bronce\n\nXbox: Por confirmar (3DJuegos)\n\n«A partnership with mass appeal.»\n\nDescripción oficial (PowerPyx, oculta): «A partnership with mass appeal.» Sweatschool y PowerPyx: alcanza la fuerza máxima con Jason y con Lucia entrenando en clubes de fitness. Se puede a partir del capítulo 2 (tras Coffee Break, cuando ya puedes cambiar de personaje). PowerPyx: revisa la fuerza en el menú del personaje (icono de corazón). Compra membresía en un gimnasio; ve con la pareja (al entrenar con uno, el otro completa el entrenamiento). Hay filtro de clubes en Mapa > Actividades. También se puede entrenar en casa después de la historia.\n\nConsejos: PowerPyx: entrenar en pareja duplica el progreso.\n\nPerdible: No\n\nOculto: Sí (Sweatschool)\n\nDiscrepancias: 3DJuegos lo lista como oculto con obtención, valor y si es perdible «Por confirmar»."},{"id":13,"name":"Positive Mental Attitude","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Meditate at every spot across Leonida.»\n\nMedita en todos los puntos de meditación de Leonida. 3DJuegos y PowerPyx coinciden en que hay 18 puntos. PowerPyx: están en 10 localizaciones; meditar con Lucia y con Jason en el mismo sitio cuenta como +2; se sigue en Progreso > Colecciones > Exploración > Meditations. Solo cuentan los puntos marcados en el mundo (icono morado).\n\nConsejos: Hay una meditación opcional en la casa de Jason en el capítulo 1, cuando Lucia ofrece enseñarte. PowerPyx y Game Checklists (citados por Sweatschool, comprobado el 23 de noviembre de 2026) confirman que esa no hace falta para el trofeo.\n\nPerdible: Discrepan las fuentes (ver notas)\n\nOculto: No\n\nDiscrepancias: 3DJuegos lo marca como perdible (Sí). Sweatschool, tras la comprobación de PowerPyx del 23 de noviembre de 2026, lo da como no perdible. PowerPyx cifra en 0 los trofeos perdibles."},{"id":14,"name":"Don't Touch My Deck","grade":"Plata","detail":"Plata\n\nXbox: 40G\n\n«Complete 3 Collectible Card sets.»\n\nCompleta 3 mazos de cartas coleccionables. Sweatschool: hay 18 mazos; el más pequeño tiene 12 cartas.\n\nPerdible: No\n\nOculto: No"},{"id":15,"name":"You WAiNKer!","grade":"Plata","detail":"Plata\n\nXbox: 40G\n\n«WAiNK It at 100 locations.»\n\nUsa WAiNK It en 100 localizaciones. Sweatschool: cuentan landmarks, curiosities, esculturas y etiquetas No Flusher, y hay más de 100 en total.\n\nPerdible: No\n\nOculto: No"},{"id":16,"name":"Whip It Good","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Discover 100 vehicles.»\n\nDescubre 100 vehículos. Sweatschool: basta con escanearlos con la app WAiNK; no hace falta conducirlos. PowerPyx aclara que el 100 % pide escanear 200 de 277 modelos base (barcos y aeronaves también cuentan), un umbral distinto al de este trofeo.\n\nConsejos: Empieza a escanear desde el capítulo 1; se va acumulando solo.\n\nPerdible: No\n\nOculto: No"},{"id":17,"name":"Hot Together","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Lose a 4 star Wanted Level with your partner and escape the heat.»\n\nPierde un nivel de búsqueda de 4 estrellas con tu pareja. Hace falta tener a ambos personajes juntos, así que se abre a partir del capítulo 2. Sweatschool: se reporta que sale de forma natural en una misión opcional tardía del capítulo 4.\n\nConsejos: Output Lag (citado por Sweatschool): solo se desbloquea cuando sales de la zona roja de calor (heat), no basta con salir del área de búsqueda intermitente.\n\nPerdible: No\n\nOculto: No"},{"id":18,"name":"Retail Therapy","grade":"Bronce","detail":"Terapia de compras\n\nBronce\n\nXbox: 5G\n\n«Rob 3 shops back-to-back with your partner without losing your Wanted Level.»\n\nRoba 3 tiendas seguidas con tu pareja sin perder el nivel de búsqueda. Debes permanecer buscado todo el rato. Elige tres tiendas cercanas.\n\nConsejos: Output Lag (citado por Sweatschool): llama primero a tu pareja; la cadena se rompe si las estrellas bajan a la fase roja de calor; el trofeo puede tardar unos 30 segundos en aparecer tras la tercera tienda.\n\nPerdible: No\n\nOculto: No"},{"id":19,"name":"Sneakthief","grade":"Bronce","detail":"Ladrón sigiloso\n\nBronce\n\nXbox: 5G\n\n«Rob a jewelry store without being detected.»\n\nRoba una joyería sin ser detectado. Posible cuando una misión del capítulo 3 te da la Snap Gun (Sweatschool).\n\nConsejos: GamerHour (citado por Sweatschool) sugiere Richardson Jewelry & Diamonds, en el centro: entra por la puerta trasera del callejón, lee la nota adhesiva del banco de trabajo para el código de la caja, apaga el panel de alarma de la pared, destruye las grabaciones en el grabador de CCTV, vacía la caja y el trofeo salta al alejarte en el coche.\n\nPerdible: No\n\nOculto: No"},{"id":20,"name":"Maximum Withdrawal","grade":"Plata","detail":"Plata\n\nXbox: 5G (3DJuegos lo lista como bronce; el grado en Sweatschool y PowerPyx es plata)\n\n«Rob 5 Bank Vaults and escape.»\n\nAsalta 5 cámaras acorazadas (bank vaults) y escapa. Las cámaras se abren tarde, tras una misión opcional del capítulo 4. Sweatschool: hay 8, una en cada banco grande. PowerPyx nombra esa misión opcional: That's Where The Money Is… (Wait at the Cafe), al final del capítulo 4; hay que seguir furgones de seguridad, esperar a que abran la cámara y robar. Tras el atraco hay 4 estrellas. Para el 100 % hay que completar las 8, así que este trofeo sale por el camino.\n\nConsejos: PowerPyx: un banco grande puede dar hasta 205.000 $; Yasmani vende pistas sobre furgones de seguridad por 10.000 $ (antes hay que hacer sus encargos previos, entre ellos 2 Payday Loans). Recomienda moto rápida para huir y luego cambiar de vehículo.\n\nPerdible: No\n\nOculto: No\n\nDiscrepancias: 3DJuegos lo lista como Bronce 5G. Sweatschool y PowerPyx lo dan como Plata. El recuento de 6 platas de ambas guías solo cuadra si este es plata."},{"id":21,"name":"A Classic Blitz Play","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Rob an Armored Truck and escape.»\n\nAsalta un furgón blindado (armored truck) y escapa. Sweatschool: se desbloquea en el mismo punto que las cámaras de los bancos.\n\nConsejos: Output Lag (citado por Sweatschool): aparece solo después de salir de la zona roja de calor, igual que Hot Together.\n\nPerdible: No\n\nOculto: No"},{"id":22,"name":"Pest Control","grade":"Bronce","detail":"Control de plagas\n\nBronce\n\nXbox: 5G\n\n«Rob an Illegal Operation belonging to each gang.»\n\nAsalta una operación ilegal de cada banda. Hay 9 bandas y 39 operaciones. Para este trofeo basta una por banda; el 100 % pide las 39. Se marcan con iconos amarillos al acercarte; muchas también las marca la historia. Se puede seguir en Progreso > Bandas.\n\nConsejos: Sweatschool (guía de 100 %): se reponen tras una espera larga, así que un objeto clave que se te pase se puede recoger después.\n\nPerdible: No\n\nOculto: No"},{"id":23,"name":"Gunslinger","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Take down 5 enemies in a single use of Combat Focus.»\n\nAbate a 5 enemigos en un solo uso de Combat Focus (modo concentración). Sweatschool: se reporta que solo cuentan miembros de bandas, no policía, soldados ni civiles. Una operación de banda es un buen sitio.\n\nConsejos: Output Lag (citado por Sweatschool): un fusil de asalto ayuda a derribar a cinco antes de que se vacíe la barra; la adrenalina alarga Combat Focus.\n\nPerdible: No\n\nOculto: No"},{"id":24,"name":"Dime on the Dollar","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Earn $250,000 laundering Marked Bills through your contacts.»\n\nBlanquea 250.000 $ en billetes marcados a través de contactos (fences). Los billetes marcados salen de bancos y tiendas de payday loans. PowerPyx: primero hay que terminar Credit Check (capítulo 3, conocer a la cuadrilla de Raul) para desbloquear el Dye Pack Jammer. El total se acumula entre varios atracos; no hace falta llevar 250.000 $ de una vez. Yasmani, en Vice City, es quien más paga según PowerPyx.\n\nConsejos: PowerPyx: las cámaras de bancos (tras la opcional del cap. 4) pueden dar hasta 205.000 $ en un solo atraco. Sale de forma natural al hacer los robos del 100 %.\n\nPerdible: No\n\nOculto: No"},{"id":25,"name":"Treat Yo Self","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Spend $100,000 across all shops.»\n\nGasta 100.000 $ repartidos entre todas las tiendas. Sweatschool y PowerPyx: armas, modificaciones de coches y tatuajes suman más rápido. PowerPyx enumera tipos de tienda: 14 mod shops, 19 Pay 'n' Sprays, 24 Ammu-Nations, 67 tiendas de ropa, 17 de calzado, 18 salones de belleza, 11 estudios de tatuaje y 15 tiendas de electrónica.\n\nPerdible: No\n\nOculto: No"},{"id":26,"name":"Little Boxes","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Purchase all garage properties.»\n\nCompra todos los garajes que se pueden comprar. Sweatschool y PowerPyx: son 8 garajes por un total de 160.000 $, a través de la app inmobiliaria (Vice City Real Estate) desde el capítulo 2. PowerPyx: se desbloquea tras Daily Driver (robar el Crawler para Moses). El juego tiene 13 garajes en total: 4 más salen por la historia y uno, Southside Storage, es recompensa de los 1010 Murals (Sweatschool). Solo cuentan los 8 que compras.\n\nPerdible: No\n\nOculto: No"},{"id":27,"name":"On the Spot","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Register 10 vehicles to the Scooter Bros app.»\n\nRegistra 10 vehículos en la app Scooter Bros. Sweatschool: primero hace falta espacio de garaje, así que compra garajes antes.\n\nPerdible: No\n\nOculto: No"},{"id":28,"name":"Strangers & Freaks","grade":"Plata","detail":"Extraños y locos\n\nPlata\n\nXbox: 40G\n\n«Complete 8 mission strands for strangers across the state of Leonida.»\n\nCompleta 8 cadenas de misiones de extraños y locos. No todas las secundarias cuentan. PowerPyx (citado y confirmado en Sweatschool) lista estas ocho: Kirk (Skunk Ape / Mr. Mangrove); Kyle; Yago; Pilot Pete; Dr. Merle (No Flushers); Freddie; la cadena oculta de Missing Persons / personas desaparecidas en Port Gellhorn (PowerPyx la asocia a Alvan); y Papa Audacity, el especialista en acrobacias, cuyas seis misiones empiezan en el capítulo 3. PowerPyx señala que líneas como las de Moses, Tyrone, Yasmani, Andy, Billy o Eddie no cuentan para este trofeo. Se pueden hacer en mundo abierto después de la historia.\n\nConsejos: Sweatschool: la carrera Race Against Yago va con temporizador; si se te pasa, se cerraría una de las cadenas que cuentan. Hazla el día que aparezca. Aun así, PowerPyx mantiene el recuento de 0 trofeos perdibles.\n\nPerdible: No, con un aviso de temporizador (ver consejos)\n\nOculto: No\n\nDiscrepancias: 3DJuegos escribe el nombre en minúsculas («extraños y locos»). El nombre original en inglés es Strangers & Freaks."},{"id":29,"name":"Road to Rehabilitation","grade":"Bronce","detail":"El camino hacia la rehabilitación\n\nBronce\n\nXbox: 5G\n\n«Complete the final mission for Andy.»\n\nTermina la última misión de Andy. Sweatschool: su cadena se juega con Lucia y empieza en el capítulo 3.\n\nPerdible: No\n\nOculto: Sí (Sweatschool)"},{"id":30,"name":"This Was No Boat Accident","grade":"Bronce","detail":"Esto no fue un accidente de barco\n\nBronce\n\nXbox: 5G\n\n«Complete the final mission for Kenton.»\n\nTermina la última misión de Kenton. 3DJuegos nombra esa misión como Conflictos Marítimos. Sweatschool: sus búsquedas de tesoros empiezan un tiempo después de la misión del capítulo 1 Island Dreams; se ausenta una temporada y vuelve más tarde.\n\nPerdible: No\n\nOculto: Sí (Sweatschool)"},{"id":31,"name":"The Lone Rider","grade":"Bronce","detail":"El jinete solitario\n\nBronce\n\nXbox: 5G\n\n«Complete the final mission for Billy.»\n\nTermina la última misión de Billy. 3DJuegos nombra esa misión como Héroes locales. Sweatschool: su cadena empieza en el capítulo 2.\n\nPerdible: No\n\nOculto: Sí (Sweatschool)"},{"id":32,"name":"Supply & Demand","grade":"Bronce","detail":"Oferta y demanda\n\nBronce\n\nXbox: 5G\n\n«Complete the final mission for Randy.»\n\nTermina la última misión de Randy. Sweatschool: tiene una lista de deseos de 16 coches y empieza en el capítulo 3.\n\nConsejos: Sweatschool (100 %): haz la lista de Randy pronto en el capítulo 3; cubre gran parte del total de vehículos para el fence.\n\nPerdible: No\n\nOculto: Sí (Sweatschool)"},{"id":33,"name":"Spin On This!","grade":"Bronce","detail":"¡Dale una vuelta a esto!\n\nBronce\n\nXbox: 5G\n\n«Complete the final mission for Tyrone.»\n\nTermina la última misión de Tyrone. Sweatschool: su cadena se juega con Jason y empieza en el capítulo 3.\n\nPerdible: No\n\nOculto: Sí (Sweatschool)"},{"id":34,"name":"Fair Game","grade":"Bronce","detail":"Juego limpio\n\nBronce\n\nXbox: 5G\n\n«Hunt a unique animal for Bret.»\n\nCaza un animal único para Bret. Sweatschool: su cadena de caza se juega con Jason y empieza en el capítulo 2. PowerPyx: se marca en algún momento después de Coffee Break (cap. 2); Jason recibe un mensaje de Bret Vogel que apunta la primera misión Veteran Hunted (Meet Bret) en Lummox County (Lucia no recibe el mensaje). Luego marca cotos con iconos morados (Target Deck). Hay 15 Target Decks; el 100 % pide los 15. En la primera misión te da el rifle «Killtelligence SM-69».\n\nConsejos: PowerPyx: un disparo limpio deja al animal en estado prístino y paga más, pero no es obligatorio para la cadena.\n\nPerdible: No\n\nOculto: Sí (Sweatschool)\n\nDiscrepancias: Sweatschool (actualizado) y PowerPyx: todavía no está confirmado qué animal concreto desbloquea el trofeo, aunque terminar los 15 Target Decks de Bret para el 100 % debería cubrirlo."},{"id":35,"name":"Catch Me If You Can","grade":"Bronce","detail":"Bronce\n\nXbox: Por confirmar (3DJuegos)\n\n«Make an unscheduled departure at VCIA.»\n\nDescripción oficial (PowerPyx): «Make an unscheduled departure at VCIA.» Roba un avión de pasajeros grande en el aeropuerto de Vice City (VCIA) y despega. GamerHour (citado por Sweatschool): hay un avión de dos pisos junto a la terminal; sube por las escaleras laterales y ve a la cabina en la cubierta superior. Output Lag (citado por Sweatschool): solo cuenta un avión acoplado a un finger (puente de embarque); nombra las puertas E3 y E4; el trofeo aparece a unos 1 km del aeropuerto. Guarda partida antes.\n\nConsejos: PowerPyx también cubre el método en su guía; Sweatschool enlaza además un artículo propio sobre este trofeo.\n\nPerdible: No (3DJuegos: por confirmar)\n\nOculto: Sí (Sweatschool)\n\nDiscrepancias: 3DJuegos resume «Despega sin autorización desde el aeropuerto VCIA», pero deja grado y si es perdible como «Por confirmar»."},{"id":36,"name":"Challenging Tank","grade":"Bronce","detail":"Bronce\n\nXbox: Por confirmar (3DJuegos)\n\n«Kinda hot in these Rhinos.»\n\nDescripción oficial (PowerPyx): «Kinda hot in these Rhinos.» Sweatschool: se reporta como robar un tanque de la base aérea militar y combatir desde él hasta que salte el trofeo. Output Lag (citado por Sweatschool) sitúa los tanques en el lado sur de la base.\n\nPerdible: No (3DJuegos: por confirmar)\n\nOculto: Sí (Sweatschool)\n\nDiscrepancias: 3DJuegos lo deja todo como «Por confirmar», salvo el nombre."},{"id":37,"name":"Let's Go Bowling","grade":"Bronce","detail":"Bronce\n\nXbox: Por confirmar (3DJuegos)\n\n«Follow-through at the Kolt & Associates’ bowling alley.»\n\nDescripción oficial (PowerPyx): «Follow-through at the Kolt & Associates' bowling alley.» Roba los 3 objetos clave en Kingpin Bowling (operación de banda en Port Gellhorn) y pierde a la policía. PowerPyx: se visita en la misión opcional del capítulo 2 Hit Kingpin Bowling. Los tres objetos: 1) un reloj de lujo; 2) la escopeta única Gutterball Moreland 850; 3) la caja fuerte de la oficina (código 0300, o volarla con sticky bombs). El trofeo salta al escapar de la policía, no al coger el tercer objeto. No hace falta matar a todos los enemigos. Si no coges los tres a la primera, la operación reaparece después (tarda) y puedes completar lo que falte; no es perdible ni hace falta llevarte los tres en una sola visita.\n\nConsejos: Ubicaciones internas: Sweatschool sitúa el reloj en la mesa redonda de la primera sala y la escopeta en un estuche sobre la mesa de billar. PowerPyx sitúa el reloj en la oficina del sureste y la escopeta sobre una mesa en la esquina noreste, con la caja en el pasillo noreste. Conviene contrastar ambas al ir al sitio.\n\nPerdible: No\n\nOculto: Sí (Sweatschool)\n\nDiscrepancias: 3DJuegos describe este trofeo como «Tira los bolos de una bolera con un golpe desde el coche», que no coincide con Sweatschool ni con PowerPyx (eso se parece más a Ten Pin). Grado y perdible: «Por confirmar» en 3DJuegos."},{"id":38,"name":"Actions Speak Louder","grade":"Bronce","detail":"Bronce\n\nXbox: Por confirmar (3DJuegos)\n\n«Choices made (for better or worse).»\n\nDescripción oficial (PowerPyx): «Choices made (for better or worse).» Sweatschool: se reporta como 500 acciones que mueven tu Perfil Criminal. Debería salir por sí solo al jugar.\n\nPerdible: No (3DJuegos: por confirmar)\n\nOculto: Sí (Sweatschool)\n\nDiscrepancias: 3DJuegos lo deja como «Por confirmar»."},{"id":39,"name":"In The Beginning...","grade":"Bronce","detail":"Bronce\n\nXbox: Por confirmar (3DJuegos)\n\n«Enjoy a cocktail with a view on Ocean Beach.»\n\nDescripción oficial (PowerPyx): «Enjoy a cocktail with a view on Ocean Beach.» Ve al Ocean View Rooftop Bar del Ocean View Hotel, en Ocean Beach. Sweatschool: cruza la zona de la piscina, sube en el ascensor y compra un Apple Martini por 10 $. PowerPyx: bébelo de pie junto a la barra. GamerHour (citado por Sweatschool) dice beberlo en la barandilla mirando a la playa.\n\nConsejos: Hay una discrepancia menor entre PowerPyx (junto a la barra) y GamerHour (en la barandilla). Conviene probar primero lo que indica PowerPyx, que es la referencia que Sweatschool actualizó.\n\nPerdible: No (3DJuegos: por confirmar)\n\nOculto: Sí (Sweatschool)\n\nDiscrepancias: 3DJuegos deja este trofeo como «Por confirmar» en obtención, valor y perdible, y atribuye «Tomarte un cóctel con vistas en Ocean Beach» al trofeo Ten Pin, no a este."},{"id":40,"name":"Capital Offense","grade":"Bronce","detail":"Bronce\n\nXbox: Por confirmar (3DJuegos)\n\n«Smash your way out of a vehicle showroom in classic style.»\n\nDescripción oficial (PowerPyx): «Smash your way out of a vehicle showroom in classic style.» Roba el Banshee azul del concesionario/showroom del sur de Vice City y sácalo estrellándote contra el escaparate. Necesitas el Key Cloner, que llega con la misión del capítulo 3 Clonin' Keys, Makin' Gs (PowerPyx precisa: robar el Zorrusso para Randy). El trofeo salta un momento después, más adelante en la calle. Solo cuenta este Banshee azul.\n\nPerdible: No (3DJuegos: por confirmar)\n\nOculto: Sí (Sweatschool)\n\nDiscrepancias: 3DJuegos resume «Sal de un concesionario reventando el escaparate», pero deja grado y perdible como «Por confirmar»."},{"id":41,"name":"Bad Luck, I Guess","grade":"Bronce","detail":"Bronce\n\nXbox: Por confirmar (3DJuegos)\n\n«Second time’s the charm.»\n\nDescripción oficial (PowerPyx): «Second time's the charm.» Sweatschool: con Lucia, sola, vuelve a robar la tienda de Payday Loans de Little Cuba del Prólogo. Coge el efectivo de los tres cajones y huye a pie, no en un vehículo. El trofeo salta al salir del área de búsqueda y alejarte lo suficiente. Posible después de la misión del capítulo 3 Credit Check.\n\nPerdible: No (3DJuegos: por confirmar)\n\nOculto: Sí (Sweatschool)\n\nDiscrepancias: 3DJuegos lo deja como «Por confirmar»."},{"id":42,"name":"The Truth Is Out There","grade":"Bronce","detail":"Bronce\n\nXbox: Por confirmar (3DJuegos)\n\n«What the hell just happened?»\n\nDescripción oficial (PowerPyx): «What the hell just happened?» Sweatschool: ve solo a la carretera al noroeste del Starlet Motel después de las 2:00 a. m. A veces hay un coche con luces intermitentes. Si no está, aléjate y vuelve. Sigue el camino al bosque hasta una luz azul brillante, habla con la mujer, ofrécete a ayudar y regresa a su coche en el arcén.\n\nConsejos: Sweatschool tiene un artículo específico sobre este trofeo (UFO).\n\nPerdible: No (3DJuegos: por confirmar)\n\nOculto: Sí (Sweatschool)\n\nDiscrepancias: 3DJuegos lo deja como «Por confirmar»."},{"id":43,"name":"Ten Pin","grade":"Bronce","detail":"Bronce\n\nXbox: Por confirmar (3DJuegos)\n\n«Bowl ’em over with a melee drive-by.»\n\nDescripción oficial (PowerPyx): «Bowl 'em over with a melee drive-by.» Monta cualquier motocicleta y patea a 10 peatones en 60 segundos (cuadrado en PlayStation, según Sweatschool). GamerHour (citado por Sweatschool) dice que también vale una bicicleta. Las calles concurridas de Vice City u Ocean Beach funcionan mejor.\n\nPerdible: No (3DJuegos: por confirmar)\n\nOculto: Sí (Sweatschool)\n\nDiscrepancias: 3DJuegos atribuye a Ten Pin «Tomarte un cóctel con vistas en Ocean Beach», que Sweatschool y PowerPyx asignan a In The Beginning... El método de atropellar/patear peatones desde una moto es el que coinciden esas dos fuentes."},{"id":44,"name":"Just Like Paradise","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Complete Gone Fishing.»\n\nCompleta Gone Fishing, la primera misión del capítulo 1. 3DJuegos traduce la misión como Día de Pesca (escrito «Dia de Pesca»). PowerPyx: automático, no se puede perder.\n\nPerdible: No (trofeo de historia)\n\nOculto: Sí (grupo Historia; forma parte de los 28 ocultos que indica Sweatschool)"},{"id":45,"name":"Paradise Lost","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Complete Chapter 1.»\n\nTermina el capítulo 1. PowerPyx: salta al completar la primera misión del capítulo 2, What's in the Bag?.\n\nPerdible: No (trofeo de historia)\n\nOculto: Sí (grupo Historia; Sweatschool)"},{"id":46,"name":"T**s Ass Drug Money","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Complete Chapter 2.»\n\nTermina el capítulo 2. PowerPyx: salta al completar la primera misión del capítulo 3, Welcome to Vice City. Las fuentes escriben el nombre con asteriscos (T**s).\n\nPerdible: No (trofeo de historia)\n\nOculto: Sí (grupo Historia; Sweatschool)"},{"id":47,"name":"Vice City, Baby!","grade":"Bronce","detail":"Bronce\n\nXbox: 5G\n\n«Complete Chapter 3.»\n\nTermina el capítulo 3. PowerPyx: salta al completar las dos primeras misiones del capítulo 4, Ocean Beach y Another Life.\n\nPerdible: No (trofeo de historia)\n\nOculto: Sí (grupo Historia; Sweatschool)"},{"id":48,"name":"Top Of The World, Ma","grade":"Bronce","detail":"Bronce\n s==='done')===done.has(r.id))&&(r.name+' '+r.detail).toLowerCase().includes(q));$('trResults').textContent=filtered.length+' trofeos visibles';$('trList').replaceChildren(...filtered.map(r=>{let d=document.createElement('details');d.dataset.id=r.id;d.open=open.has(String(r.id));d.style.setProperty('--tc',colors[r.grade]);let title=document.createElement('summary');title.textContent=(done.has(r.id)?'✓ ':'🏆 ')+r.name+' · '+r.grade;let p=document.createElement('p');p.textContent=r.detail;let label=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=done.has(r.id);c.onchange=()=>{if(c.checked)done.add(r.id);else done.delete(r.id);try{localStorage.setItem('viceRouteTrophiesV1',JSON.stringify([...done]))}catch(e){alert('No se pudo guardar el progreso')}stats();render()};label.append(c,'Marcar como obtenido');d.append(title,label,p);return d}))}$('trHero').onclick=()=>{let p=$('trPanel');p.hidden=!p.hidden;$('trHero').setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden)render()};['trSearch','trGrade','trState'].forEach(id=>$(id).addEventListener('input',render));stats();render()})();</script>
